# Copy to ./sdb.toml for project-local settings, or to
# ~/.config/sdb/config.toml for user-wide settings.

[reference]
# "all" expands to every registered whole-catalog reference provider.
providers = ["all"]
max_age_days = 30

[catalog]
# Direct provider coverage expected for every target. "all" is the default.
providers = ["all"]

[export]
# Canonical root containing one directory per SDF fitting group.
# root = "/srv/sdb/seds/masters"

[operator]
# actor = "your name"

[mirrors]
# simbad = "simbad.harvard.edu"
# vizier = "vizier.nao.ac.jp"
