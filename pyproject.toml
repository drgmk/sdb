[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdb-identity"
version = "0.30.0"
description = "Identity and astrometry core for SDB"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "astropy>=6",
  "astroquery>=0.4.7",
  "plotly>=6",
  "sqlalchemy>=2",
  "tqdm>=4",
]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27"]
review = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
sdb = "sdb_identity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdb_identity = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests requiring remote astronomy services"]
